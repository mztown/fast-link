<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        width: 280px;
        padding: 16px;
        margin: 0;
        color: #222;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      .subtitle {
        font-size: 12px;
        color: #888;
        margin: 0 0 12px;
      }
      .rule {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        border-top: 1px solid #f0f0f0;
      }
      .rule-title {
        font-size: 13px;
      }
      .open-settings {
        display: block;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #f0f0f0;
        font-size: 12px;
        color: #2563eb;
        cursor: pointer;
        text-decoration: underline;
      }
      /* Switch */
      .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 22px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #ccc;
        border-radius: 22px;
        transition: background 0.2s;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 16px;
        width: 16px;
        left: 3px;
        bottom: 3px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.2s;
      }
      .switch input:checked + .slider {
        background: #16a34a;
      }
      .switch input:checked + .slider::before {
        transform: translateX(18px);
      }
    </style>
  </head>
  <body>
    <h1>Auto Link</h1>
    <p class="subtitle">自动跳转规则开关</p>

    <div class="rule">
      <span class="rule-title">Magnet 转换</span>
      <label class="switch">
        <input type="checkbox" id="enableMagnet" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="rule">
      <span class="rule-title">百度网盘转换</span>
      <label class="switch">
        <input type="checkbox" id="enableBaidu" />
        <span class="slider"></span>
      </label>
    </div>

    <a class="open-settings" id="openSettings">打开完整设置页</a>

    <script src="popup.js"></script>
  </body>
</html>
