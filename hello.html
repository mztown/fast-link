<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        width: 320px;
        padding: 16px;
        margin: 0;
        color: #222;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      .subtitle {
        font-size: 12px;
        color: #888;
        margin: 0 0 12px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #555;
        margin: 10px 0 4px;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        height: 56px;
        padding: 8px;
        font-size: 13px;
        border: 1px solid #ddd;
        border-radius: 6px;
        resize: none;
        font-family: inherit;
      }
      textarea:focus {
        outline: none;
        border-color: #2563eb;
      }
      .convert-btn {
        width: 100%;
        margin-top: 10px;
        padding: 9px;
        font-size: 14px;
        color: #fff;
        background: #2563eb;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .convert-btn:hover {
        background: #1d4ed8;
      }
      .convert-btn:disabled {
        background: #cbd5e1;
        cursor: not-allowed;
      }
      .result {
        margin-top: 10px;
        font-size: 12px;
        padding: 8px;
        border-radius: 6px;
        display: none;
        word-break: break-all;
      }
      .result.success {
        display: block;
        background: #ecfdf5;
        color: #047857;
        border: 1px solid #a7f3d0;
      }
      .result.error {
        display: block;
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
      }
      .switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
        border-top: 1px solid #f0f0f0;
      }
      .switch-title {
        font-size: 13px;
      }
      /* Switch */
      .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        height: 22px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #ccc;
        border-radius: 22px;
        transition: background 0.2s;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 16px;
        width: 16px;
        left: 3px;
        bottom: 3px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.2s;
      }
      .switch input:checked + .slider {
        background: #16a34a;
      }
      .switch input:checked + .slider::before {
        transform: translateX(18px);
      }
      .open-settings {
        display: block;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #f0f0f0;
        font-size: 12px;
        color: #2563eb;
        cursor: pointer;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Auto Link</h1>
    <p class="subtitle">粘贴字符串，一键转换为链接</p>

    <label for="input">输入 40 位 BT 哈希 或 28 位百度分享码</label>
    <textarea id="input" placeholder="例如：1W6PUbukIFsXCCEBKuGuKdg-n6g3"></textarea>
    <button class="convert-btn" id="convertBtn">转换并打开</button>

    <div class="result" id="result"></div>

    <div class="switch-row">
      <span class="switch-title">Magnet 转换</span>
      <label class="switch">
        <input type="checkbox" id="enableMagnet" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="switch-row">
      <span class="switch-title">百度网盘转换</span>
      <label class="switch">
        <input type="checkbox" id="enableBaidu" />
        <span class="slider"></span>
      </label>
    </div>

    <a class="open-settings" id="openSettings">打开完整设置页</a>

    <script src="popup.js"></script>
  </body>
</html>
