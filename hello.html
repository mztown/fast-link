<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        width: 320px;
        padding: 16px;
        margin: 0;
        color: #222;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      .subtitle {
        font-size: 12px;
        color: #888;
        margin: 0 0 12px;
      }
      label {
        display: block;
        font-size: 12px;
        color: #555;
        margin: 10px 0 4px;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        height: 56px;
        padding: 8px;
        font-size: 13px;
        border: 1px solid #ddd;
        border-radius: 6px;
        resize: none;
        font-family: inherit;
      }
      textarea:focus {
        outline: none;
        border-color: #2563eb;
      }
      /* 两个操作按钮共用尺寸，保证等大 */
      .convert-btn,
      .advanced-btn {
        width: 100%;
        margin-top: 10px;
        padding: 9px;
        font-size: 14px;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-family: inherit;
      }
      .convert-btn {
        background: #2563eb;
      }
      .convert-btn:hover {
        background: #1d4ed8;
      }
      .convert-btn:disabled {
        background: #cbd5e1;
        cursor: not-allowed;
      }
      .advanced-btn {
        background: #7c3aed;
      }
      .advanced-btn:hover {
        background: #6d28d9;
      }
      .result {
        margin-top: 10px;
        font-size: 12px;
        padding: 8px;
        border-radius: 6px;
        display: none;
        word-break: break-all;
      }
      .result.success {
        display: block;
        background: #ecfdf5;
        color: #047857;
        border: 1px solid #a7f3d0;
      }
      .result.error {
        display: block;
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
      }
    </style>
  </head>
  <body>
    <h1>Auto Link</h1>
    <p class="subtitle" data-i18n="popupSubtitle">粘贴字符串，一键转换为链接</p>

    <label for="input" data-i18n="popupInputLabel">输入 40 位 BT 哈希 或 28 位百度分享码</label>
    <textarea
      id="input"
      data-i18n-placeholder="popupInputPlaceholder"
      placeholder="例如：1W6PUbukIFsXCCEBKuGuKdg-n6g3"
    ></textarea>
    <button class="convert-btn" id="convertBtn" data-i18n="popupConvertBtn">转换并打开</button>

    <div class="result" id="result"></div>

    <button class="advanced-btn" id="openSettings" data-i18n="popupAdvancedBtn">高级模式</button>

    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
