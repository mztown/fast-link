<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Auto Link 设置</title>
    <style>
      body {
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        max-width: 480px;
        margin: 32px auto;
        padding: 0 20px;
        color: #222;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .subtitle {
        color: #888;
        font-size: 13px;
        margin: 0 0 24px;
      }
      .rule {
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
        background: #fff;
      }
      .rule-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .rule-title {
        font-size: 15px;
        font-weight: 600;
      }
      .rule-desc {
        font-size: 12px;
        line-height: 1.6;
        color: #555;
      }
      .rule-desc code {
        background: #f4f4f4;
        padding: 1px 4px;
        border-radius: 3px;
        font-size: 11px;
      }
      /* Switch */
      .switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #ccc;
        border-radius: 24px;
        transition: background 0.2s;
      }
      .slider::before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.2s;
      }
      .switch input:checked + .slider {
        background: #16a34a;
      }
      .switch input:checked + .slider::before {
        transform: translateX(20px);
      }
      .save-status {
        margin-top: 8px;
        font-size: 13px;
        color: #16a34a;
        min-height: 20px;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .save-status.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <h1>Auto Link 设置</h1>
    <p class="subtitle">选择需要启用的自动跳转规则</p>

    <div class="rule">
      <div class="rule-head">
        <span class="rule-title">Magnet 链接转换</span>
        <label class="switch">
          <input type="checkbox" id="enableMagnet" />
          <span class="slider"></span>
        </label>
      </div>
      <p class="rule-desc">
        访问以 <code>40 位英文字母数字混合</code> 起始、后面是结束或
        <code>&amp;</code> 的字符串时，自动在前面加上
        <code>magnet:?xt=urn:btih:</code> 并跳转。
      </p>
    </div>

    <div class="rule">
      <div class="rule-head">
        <span class="rule-title">百度网盘链接转换</span>
        <label class="switch">
          <input type="checkbox" id="enableBaidu" />
          <span class="slider"></span>
        </label>
      </div>
      <p class="rule-desc">
        访问以 <code>28 位大小写英文/数字/减号混合</code> 起始、其中
        <code>倒数第 5 位为 -</code>、后 4 位为英文数字的字符串时，自动在前面加上
        <code>https://pan.baidu.com/s/</code>，并将倒数第 5 位的
        <code>-</code> 替换为 <code>?pwd=</code> 后跳转。
      </p>
    </div>

    <div class="save-status" id="saveStatus">已保存</div>

    <script src="options.js"></script>
  </body>
</html>
